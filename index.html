<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Made in Brazil</title>
<meta name="description" content="Dois jogos para aprender expressões em inglês a partir das expressões brasileiras.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Direção: a paleta e as formas do guia "inspirado no Duolingo" (referencia-duolingo/DESIGN-pt-br.md), sem a coruja.
   Fundo branco, verde como cor principal, cada botão e cartão com aba grossa embaixo que afunda ao toque,
   bordas de 2px, cantos redondos, letra arredondada e pesada. Cada tela tem uma cor de destaque (--art) para as figuras. */
:root {
  --green: #58cc02;  --green-d: #58a700;  --green-l: #89e219;  --green-p: #d7ffb8;
  --red: #ff4b4b;    --red-d: #ea2b2b;    --red-p: #ffdfe0;
  --orange: #ff9600; --orange-d: #cc7a00;
  --blue: #1cb0f6;   --blue-d: #1899d6;   --blue-p: #ddf4ff;
  --purple: #ce82ff; --yellow: #ffc800;
  --snow: #ffffff;   --polar: #f7f7f7;    --swan: #e5e5e5;   --hare: #afafaf;   --wolf: #777777;   --eel: #3c3c3c;
  --field: var(--snow);
  --on: var(--eel);
  --art: var(--blue);
  --card: var(--snow);
  --card-lip: var(--swan);
  --ink: var(--eel);
  --display: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", system-ui, sans-serif;
  --text: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", system-ui, sans-serif;
  --step-small: .875rem;
  --step-body: 1.0625rem;
  --step-lead: 1.3rem;
  --step-head: clamp(1.9rem, 1.2rem + 3.6vw, 2.6rem);
  --step-huge: clamp(2.8rem, 1.8rem + 6vw, 4.2rem);
  --back: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
html { background: var(--field); }
html, body { min-height: 100%; }
body {
  background: var(--field);
  color: var(--on);
  font-family: var(--text);
  font-size: var(--step-body);
  font-weight: 700;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
* { box-sizing: border-box; }
h1, h2, p, ul { margin: 0; }
.app { max-width: 30rem; margin: 0 auto; padding-block: 16px 44px; display: flex; flex-direction: column; gap: 20px; }
.display { font-family: var(--display); font-weight: 900; letter-spacing: -.01em; line-height: 1.08; text-wrap: balance; }
.huge { font-size: var(--step-huge); line-height: 1; }
.head { font-size: var(--step-head); }
.lead { font-size: var(--step-lead); line-height: 1.25; }
.small { font-size: var(--step-small); }
.strong { font-weight: 800; }
h1.strong { font-weight: 900; font-size: 1.35rem; color: var(--green); }
.nums { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Ícones e figuras */
.ico { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.art { flex: none; width: var(--s, 96px); height: var(--s, 96px); color: var(--art); }
.art svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* Barra do topo */
.bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 48px; }
.iconbtn {
  width: 44px; height: 44px; display: grid; place-items: center; flex: none;
  background: var(--snow); color: var(--hare); border: 2px solid var(--swan); border-radius: 14px; cursor: pointer;
  box-shadow: 0 4px 0 var(--swan); transition: transform .1s ease, box-shadow .1s ease;
}
.iconbtn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--swan); }
.chipstat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 2px solid var(--swan); border-radius: 999px; font-weight: 800; color: var(--hare); }
.chipstat.hot { color: var(--orange); border-color: #ffd28a; }

/* Botões: aba grossa embaixo, afundam ao toque */
.btn {
  font: inherit; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; text-align: left;
  width: 100%; min-height: 54px; padding: 13px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--green); color: var(--snow);
  border: 0; border-radius: 16px; cursor: pointer;
  box-shadow: 0 4px 0 var(--green-d);
  transition: transform .1s ease, box-shadow .1s ease, opacity .2s ease, background-color .15s ease;
}
@media (hover: hover) { .btn:not(.quiet):not([id^="opt-"]):not(.danger):hover:not(:disabled) { background: var(--green-l); } }
.btn.big { min-height: 58px; font-size: 1.0625rem; }
.btn .small { font-weight: 800; opacity: .85; }
.btn.danger { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
.btn.quiet { background: var(--snow); color: var(--blue); border: 2px solid var(--swan); box-shadow: 0 4px 0 var(--swan); }
.btn:disabled { cursor: default; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
.opts { display: flex; flex-direction: column; gap: 12px; }
/* Respostas: cartões brancos, texto normal */
.btn[id^="opt-"] { background: var(--snow); color: var(--eel); text-transform: none; letter-spacing: 0; border: 2px solid var(--swan); box-shadow: 0 4px 0 var(--swan); }
.btn[id^="opt-"].right { background: var(--green-p); border-color: var(--green); box-shadow: 0 4px 0 var(--green-d); color: var(--green-d); }
.btn[id^="opt-"].wrong { background: var(--red-p); border-color: var(--red); box-shadow: 0 4px 0 var(--red-d); color: var(--red-d); }
.btn[id^="opt-"].dim { opacity: .5; }
.link { font: inherit; font-weight: 800; color: var(--blue); background: none; border: 0; padding: 8px 0; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; font-size: var(--step-small); align-self: flex-start; text-align: left; }
.btn:focus-visible, .link:focus-visible, .chip:focus-visible, .chapter:focus-visible, .iconbtn:focus-visible, .tilebtn:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* Home */
.daily {
  background: var(--snow); padding: 18px; border: 2px solid var(--swan); border-radius: 20px;
  box-shadow: 0 4px 0 var(--swan);
  display: flex; flex-direction: column; gap: 14px; position: relative;
}
.daily .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.daily .small.strong { color: var(--hare); text-transform: uppercase; letter-spacing: .06em; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tilebtn {
  font: inherit; text-align: left; border: 0; border-radius: 20px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; gap: 14px; justify-content: space-between;
  padding: 16px; min-height: 14.5rem;
  background: var(--cf); color: var(--co);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--cf) 78%, #000);
  transition: transform .1s ease, box-shadow .1s ease;
}
.tilebtn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
.tilebtn .name { font-family: var(--display); font-weight: 900; letter-spacing: -.01em; line-height: 1.05; font-size: 1.6rem; }
.mini { display: flex; flex-direction: column; gap: 6px; font-size: var(--step-small); font-weight: 800; }
.meter { height: 16px; border-radius: 999px; overflow: hidden; background: var(--swan); }
.meter i { display: block; height: 100%; min-width: 0; border-radius: 999px; background: var(--green); transition: width .32s ease-out; }
.tilebtn .meter { background: rgba(0, 0, 0, .16); }
.tilebtn .meter i { background: var(--co); }

/* Paradas da viagem */
.chapters { display: flex; flex-direction: column; gap: 14px; }
.chapter {
  font: inherit; text-align: left; border: 0; border-radius: 20px; cursor: pointer;
  display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: var(--cf); color: var(--co);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--cf) 78%, #000);
  transition: transform .1s ease, box-shadow .1s ease;
}
.chapter:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
.chapter .art { --s: 60px !important; }
.chapter .name { display: block; font-family: var(--display); font-weight: 900; letter-spacing: -.01em; line-height: 1.1; font-size: 1.45rem; }
.chapter .fact { display: block; font-size: var(--step-small); font-weight: 800; }
.chapter.locked { background: var(--swan); color: var(--hare); cursor: default; box-shadow: 0 6px 0 #cfcfcf; --art: var(--hare); }

/* Pergunta */
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: center; }
.steps i { height: 16px; border-radius: 999px; background: var(--swan); transition: background-color .3s, transform .32s var(--back); }
.steps i.ok { background: var(--green); }
.steps i.no { background: var(--red); }
.steps i.now { background: var(--hare); }
.bar > .strong { color: var(--hare); }
.stage { position: relative; display: flex; flex-direction: column; gap: 10px; }
.stage > p.strong { color: var(--wolf); }
.burst { position: relative; }
.app > p.small.strong { color: var(--wolf); }
.feedback {
  padding: 16px; border-radius: 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  background: var(--green-p); color: var(--green-d);
}
.feedback.bad { background: var(--red-p); color: var(--red-d); }
.badge { width: 44px; height: 44px; display: grid; place-items: center; }
.badge .ico { width: 40px; height: 40px; }
.feedback .iconbtn { border-color: transparent; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); color: currentColor; }

/* Resultado */
.score { font-weight: 900; color: var(--art); }
.list { list-style: none; padding: 12px 0 0; display: flex; flex-direction: column; gap: 14px; }
.list li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; color: var(--wolf); }
.list b { display: block; font-weight: 800; color: var(--eel); }
summary { cursor: pointer; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; font-size: var(--step-small); list-style: none; padding: 8px 0; }
summary::-webkit-details-marker { display: none; }
.stamp {
  flex: none; width: 6.5rem; height: 6.5rem; border-radius: 50%; color: var(--art);
  border: 5px solid currentColor; display: grid; place-items: center; text-align: center;
  font-size: var(--step-small); font-weight: 900; line-height: 1.15; padding: 8px; transform: rotate(-10deg);
}
.sharebox { width: 100%; min-height: 6.5rem; font: inherit; font-size: var(--step-small); padding: 12px; background: var(--polar); color: var(--eel); border: 2px solid var(--swan); border-radius: 14px; resize: none; }

/* Temas e álbum */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: var(--step-small); font-weight: 800; padding: 8px 16px; cursor: pointer;
  background: var(--snow); color: var(--wolf); border: 2px solid var(--swan); border-radius: 999px;
  box-shadow: 0 3px 0 var(--swan); transition: transform .1s ease, box-shadow .1s ease;
}
.chip:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
.chip[aria-pressed="true"] { background: var(--blue-p); color: var(--blue-d); border-color: #84d8ff; box-shadow: 0 3px 0 #84d8ff; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 14px 10px; }
.tile {
  min-width: 0; min-height: 9.5rem; padding: 12px; border-radius: 16px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
  background: var(--cf); color: var(--co); overflow-wrap: anywhere;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--cf) 78%, #000);
}
.tile .en { font-weight: 800; line-height: 1.2; }
.tile .sub { font-size: var(--step-small); line-height: 1.3; }
.tile .iconbtn { margin-top: auto; width: 36px; height: 36px; border-radius: 12px; border-color: transparent; color: var(--cf); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.tile.locked { background: var(--polar); color: var(--hare); border: 2px solid var(--swan); box-shadow: 0 4px 0 var(--swan); }
.tile.locked .ico { margin-top: auto; }

/* Confete: bolinhas que sobem e caem */
.confetti { position: absolute; left: 50%; top: 30%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; width: 11px; height: 11px; border-radius: 50%; }

@media (prefers-reduced-motion: no-preference) {
  .app > * { animation: rise .4s cubic-bezier(.2, .7, .2, 1) backwards; }
  .app > *:nth-child(2) { animation-delay: 60ms; }
  .app > *:nth-child(3) { animation-delay: 120ms; }
  .app > *:nth-child(4) { animation-delay: 180ms; }
  .app > *:nth-child(5) { animation-delay: 240ms; }
  .app > *:nth-child(n+6) { animation-delay: 300ms; }
  .swap { animation: pop-in .32s var(--back) backwards; }
  .cheer { animation: cheer .48s var(--back); }
  .shake { animation: shake .4s; }
  .btn.right { animation: yes .48s var(--back); }
  .btn.wrong { animation: shake .4s; }
  .stamp.thunk { animation: thunk .5s var(--back) .35s backwards; }
  .confetti i { animation: burst 1.05s cubic-bezier(.2, .8, .4, 1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(24px) scale(.94); } }
  @keyframes cheer { from { transform: scale(.5) rotate(-14deg); } }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  @keyframes yes { 40% { transform: scale(1.05); } }
  @keyframes thunk { from { opacity: 0; transform: rotate(-28deg) scale(1.9); } }
  @keyframes burst {
    55% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
    100% { transform: translate(calc(var(--dx) * 1.15), calc(var(--dy) + 120px)) scale(.6); opacity: 0; }
  }
}
</style>
</head>

const RF = { l: "yellow", r: "bone", c: "black" };   // lendária dourada, rara roxa, comum azul

// Temas, tirados das próprias frases: a palavra que aparece na expressão brasileira decide o tema.
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const WORDS = {
  bichos: "galinha pato cavalo burro macaco macacos cachorro cao gato mosca pinto onca vaca siri bico caca cacador",
  corpo: "pe pes mao maos boca olhos cara cabeca braco orelhas corpo coracao dentes",
  comida: "bolo cereja pao sopa batata queijo faca ovos bolinho petisca come comem"
};
const TAGS = D.map(r => {
  const w = new Set(norm(r[0]).split(/[^a-z]+/));
  const t = [];
  for (const k in WORDS) if (WORDS[k].split(" ").some(x => w.has(x))) t.push(k);
  if (r[3] === "p") t.push("proverbios");
  if (r[3] === "x") t.push("nalata");
  return t;
});
const THEMES = [["all", "Tudo"], ["bichos", "Bichos"], ["corpo", "Corpo"], ["comida", "Comida"], ["proverbios", "Provérbios"], ["nalata", "Na lata"]];
const artFor = i => TAGS[i].includes("bichos") ? "paw" : TAGS[i].includes("comida") ? "cheese" : TAGS[i].includes("corpo") ? "footprints"
  : D[i][3] === "p" ? "scroll" : D[i][3] === "x" ? "megaphone" : "message-circle";

let save = { got: {}, miss: {}, best: 0, trip: {}, day: null, run: 0 };
try {

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  if (tag === "button") e.setAttribute("data-kubai-trigger", "");
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Ícones e figuras, desenhados aqui ---------- */
// Ícones e figuras: Kubai Icons (MIT, github.com/kubai087/kubai-icons), embutidos na página logo acima.
// Cada ícone tem dois estados, repouso e "hover"; o jogo dispara o hover sozinho de tempos em tempos e nos acertos.
const ICON_NAMES = { back: "arrow-left", close: "circle-x", play: "play", next: "arrow-right", sound: "volume", share: "share",
  lock: "lock", check: "circle-check", flame: "flame", cards: "playing-cards", again: "rotate-cw" };
const icon = name => {
  const s = h("span", { class: "ico", "aria-hidden": "true" });
  s.append(KI.createIcon(KI.icons[ICON_NAMES[name]], { size: 24, trigger: "parent" }));
  return s;
};
const W = "#1cb0f6", C = "#ff4b4b", Y = "#ffc800", G = "#58cc02", K = "#ce82ff";   // cores do confete
let liveTimers = [], nextTimers = [];
function pulse(el, ms) {
  const k = el && el.firstChild && el.firstChild.kubai;
  if (!k) return;
  k.hover(true);
  setTimeout(() => k.hover(false), ms || 1100);
}
function art(name, size, cls) {
  const d = h("div", { class: "art " + (cls || ""), style: "--s:" + size + "px", "aria-hidden": "true" });
  d.append(KI.createIcon(KI.icons[name], { size }));
  if (!calm) {
    nextTimers.push(setTimeout(() => pulse(d), 500));
    nextTimers.push(setInterval(() => pulse(d), 3400));
  }
  return d;
}
function confetti(anchor) {
  if (calm) return;
  const box = h("div", { class: "confetti" });
  const cols = [C, Y, G, W, K];
  for (let k = 0; k < 18; k++) {
    const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 90;
    box.append(h("i", { style: "background:" + cols[k % cols.length] + ";--dx:" + Math.round(Math.cos(a) * r) + "px;--dy:" + Math.round(Math.sin(a) * r - 40) + "px;--r:" + Math.round(Math.random() * 540) + "deg" }));
  }
  anchor.append(box);
  setTimeout(() => box.remove(), 1000);
}
function countUp(el, to, fmt) {
  if (calm || to === 0) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / 700);
    el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// A voz vem do aparelho de quem joga. Escolhe a melhor voz americana instalada e evita as robóticas e as de brincadeira.
let voice = null;
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    if (!vs.length) return;
    const score = v => {
      let s = 0;
      if (/^en[-_]US/i.test(v.lang)) s += 4;
      if (/natural|neural|premium|enhanced|siri/i.test(v.name)) s += 8;
      if (/google us english|samantha|ava|allison|aria|jenny|zoe|evan|nathan|joelle|noelle/i.test(v.name)) s += 5;
      if (/compact|eloquence|albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox|grandma|grandpa|rocko|shelley|sandy|flo|eddy|reed/i.test(v.name)) s -= 12;
      return s;
    };
    voice = vs.slice().sort((a, b) => score(b) - score(a))[0];
  } catch (e) {}
}
if (canSpeak) {
  pickVoice();
  try { window.speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (e) {}
}
function speak(text) {
  if (!canSpeak) return;
  try {
    if (!voice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.95;
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
const listen = (text, id) => canSpeak
  ? h("button", { class: "iconbtn", id: id || null, "aria-label": "Ouvir em inglês", onclick: e => { e.stopPropagation(); speak(text); } }, icon("sound"))
  : null;

function show(field, ...nodes) {
  const root = document.documentElement;
  root.style.setProperty("--art", ACC[field]);
  liveTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
  liveTimers = nextTimers; nextTimers = [];
  app.replaceChildren(...nodes.filter(Boolean));
  window.scrollTo(0, 0);
}

/* ---------- Sequência de dias e expressão do dia ---------- */
function dayKey(off) {
  const d = new Date();
  d.setDate(d.getDate() + off);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
const runDays = () => (save.day === dayKey(0) || save.day === dayKey(-1)) ? (save.run || 0) : 0;
function markPlayed() {
  if (save.day === dayKey(0)) return;
  save.run = save.day === dayKey(-1) ? (save.run || 0) + 1 : 1;
  save.day = dayKey(0);
  persist();
}
const daysLabel = n => n + (n === 1 ? " dia" : " dias");
const streakChip = () => h("span", { class: "chipstat nums" + (save.day === dayKey(0) ? " hot" : ""), title: "Dias seguidos jogando" },
  icon("flame"), daysLabel(runDays()));
function dailyIndex() {
  const d = new Date();
  const n = Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 86400000);
  return ((n * 37) % D.length + D.length) % D.length;   // mesma frase para todo mundo no mesmo dia
}

const poolFor = t => D.map((_, i) => i).filter(i => t === "all" || TAGS[i].includes(t));
function lobby() {
  const n = gotCount();
  const pool = poolFor(theme);
  show("yellow",
    h("div", { class: "bar" },
      h("button", { class: "iconbtn", id: "back-home", "aria-label": "Trocar de jogo", onclick: home }, icon("back")),

      streakChip()),

      h("button", { class: "chip", id: "t-" + k, "aria-pressed": String(theme === k), onclick: () => { theme = k; lobby(); } }, label))),
    h("button", { class: "btn big", id: "play", onclick: startRound },
      h("span", null, "Jogar ", h("span", { class: "small" }, Math.min(10, pool.length) + " frases")), icon("play")),
    save.best ? h("p", { class: "small nums" }, "Recorde: " + save.best + " pontos") : null
  );

function startRound() {
  const all = poolFor(theme);
  const missed = shuffle(all.filter(i => save.miss[i])).slice(0, 3);
  const fresh = shuffle(all.filter(i => !save.got[i] && !missed.includes(i)));
  const rest = shuffle(all.filter(i => save.got[i] && !missed.includes(i)));
  const items = shuffle(missed.concat(fresh, rest).slice(0, 10));
  round = { items, i: 0, score: 0, streak: 0, results: [], fresh: 0 };
  question();
}
function optionsFor(i) {
  const en = D[i][2];
  let pool = D.map((_, j) => j).filter(j => j !== i && D[j][3] === D[i][3] && D[j][2] !== en);
  const picks = shuffle(pool).slice(0, 3).map(j => D[j][2]);
  return shuffle(picks.concat(en));
}
// Bloco que aparece depois da resposta, igual nos dois jogos.
function verdict(right, title, answer, note, sayText, nextLabel, onNext) {
  const next = h("button", { class: "btn big" + (right ? "" : " danger"), id: "next", onclick: onNext }, nextLabel, icon("next"));
  return [
    h("div", { class: "feedback swap " + (right ? "good" : "bad") },
      h("span", { class: "badge" + (right ? " cheer" : "") }, icon(right ? "check" : "close")),
      h("div", { class: "stack", style: "gap:2px;min-width:0" },
        h("p", { class: "small strong verdict" }, title),
        h("p", { class: "lead strong" }, answer),
        note ? h("p", { class: "small" }, note) : null),
      listen(sayText, "say")),
    next
  ];
}
function question() {
  const i = round.items[round.i], N = round.items.length;
  const opts = optionsFor(i);
  const steps = h("div", { class: "steps", role: "img", "aria-label": "Frase " + (round.i + 1) + " de " + N },
    round.items.map((_, k) => h("i", { class: k < round.i ? (round.results[k] ? "ok" : "no") : (k === round.i ? "now" : "") })));
  const scoreEl = h("span", { class: "strong nums" }, String(round.score));
  const buttons = opts.map((t, k) => h("button", { class: "btn", id: "opt-" + k, onclick: () => answer(t) }, t));
  const after = h("div", { class: "stack", "aria-live": "polite" });
  const pic = art(artFor(i), 88);
  const stage = h("div", { class: "stage" },
    pic,
    h("p", { class: big(D[i][1]) + " lit" }, D[i][1]),
    h("p", { class: "strong" }, D[i][0]));

  function answer(t) {
    const right = t === D[i][2];
    buttons.forEach(b => {
      b.disabled = true;
      if (b.textContent === D[i][2]) b.classList.add("right");
      else if (b.textContent === t) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    let isNew = false;
    if (right) {
      round.streak++;
      round.score += 10 + Math.min(round.streak - 1, 5) * 2;
      isNew = !save.got[i];
      if (isNew) round.fresh++;
      save.got[i] = 1;
      delete save.miss[i];
      confetti(stage); pulse(pic);
    } else {
      round.streak = 0;
      save.miss[i] = 1;
      pic.classList.add("shake");
    }
    round.results.push(right);
    persist();
    scoreEl.textContent = String(round.score);
    const last = round.i === N - 1;
    after.replaceChildren(...verdict(right,
      right ? (round.streak >= 3 ? round.streak + " seguidas!" : "Isso!") : "Quase. O certo é:",
      D[i][2],
      isNew ? "Figurinha " + RAR[rarity(i)].toLowerCase() + " no álbum" : null,
      D[i][2],
      last ? "Resultado" : "Próxima",
      () => { round.i++; last ? result() : question(); }));
    document.getElementById("next").focus();
  }

  show(RF[rarity(i)],
    h("div", { class: "bar" },
      h("button", { class: "iconbtn", id: "quit", "aria-label": "Sair da rodada", onclick: lobby }, icon("close")),
      steps,
      scoreEl),
    stage,
    h("p", { class: "small strong" }, "Como um americano diz isso?"),
    h("div", { class: "opts" }, buttons),
    after
  );
}

    h("div", { class: "opts" },
      h("button", { class: "btn big", id: "again", onclick: startRound }, "Jogar de novo", icon("again")),

        h("span", { class: "nums" }, gotCount() + " de " + D.length))),

    ["hear", "Balcão da conexão", "A atendente pergunta, com o seu bilhete na mão.", "Assento no corredor ou na janela?", "Aisle seat or window seat?"]
  ] },
  { name: "Na rua", place: "Do aeroporto ao hotel", scenes: [
    ["say", "Saída do aeroporto", "Você vai até o balcão de informações.", "Pode me chamar um táxi, por favor?", "Can you get me a taxi, please?"],
    ["say", "No táxi", "Você mostra o endereço do hotel ao motorista.", "É longe?", "Is it far?"],
    ["hear", "No táxi", "O motorista responde olhando pelo retrovisor.", "Fica perto.", "It's nearby."],
    ["say", "Porta do hotel", "A corrida deu 18 dólares e você entrega uma nota de 20.", "Fique com o troco.", "Keep the change."],
    ["hear", "Aviso num poste", "Mais tarde, passeando, você lê um aviso na calçada.", "Cuidado com os trombadinhas.", "Beware of pickpockets."],
    ["say", "Na esquina", "Você virou duas ruas e não reconhece mais nada. Um policial passa.", "Eu me perdi.", "I've lost my way."]
  ] },
  { name: "Hotel", place: "Check-in e primeira noite", scenes: [
    ["say", "Recepção", "Você chega ao balcão com as malas.", "Tenho uma reserva.", "I have a reservation."],
    ["hear", "Recepção", "O recepcionista confere o computador e avisa.", "Pagamento adiantado, por favor.", "Please pay in advance."],
    ["say", "Recepção", "Antes de subir, você quer saber do café.", "A que horas é o café da manhã?", "What time is breakfast?"],
    ["hear", "Recepção", "Ele entrega a chave com um sorriso.", "Aproveite bem sua estada.", "I hope you'll enjoy your stay."],
    ["say", "Telefone do quarto", "O quarto está abafado e você liga para a recepção.", "A janela não abre.", "The window won't open."],
    ["say", "Telefone do quarto", "O passeio de amanhã sai cedo.", "Por favor, acorde-me às sete horas.", "Please wake me up at seven o'clock."]
  ] },
  { name: "Restaurante", place: "Jantar fora", scenes: [
    ["say", "Entrada", "A recepcionista vem até vocês dois.", "Mesa para dois, por favor.", "A table for two, please."],
    ["say", "À mesa", "O garçom chega com o cardápio.", "Qual é o prato-do-dia?", "What's today's special?"],
    ["hear", "À mesa", "Ele serve os pratos e diz.", "Bom apetite.", "Enjoy your meal."],
    ["hear", "À mesa", "Mais tarde ele volta com a travessa.", "Aceita mais um pouco?", "Would you like some more?"],
    ["say", "À mesa", "Você não aguenta mais nada.", "Obrigado, estou satisfeito.", "Thanks, I have had enough."],
    ["say", "À mesa", "Hora de ir embora.", "Minha conta, por favor.", "Can I have the bill, please?"]
  ] },
  { name: "Compras e passeio", place: "Um dia livre", scenes: [
    ["say", "Loja", "Você gostou de uma jaqueta sem etiqueta.", "Quanto custa?", "How much is it?"],
    ["say", "Loja", "A vendedora diz o preço e você quase cai para trás.", "É muito caro.", "It's too expensive."],
    ["say", "Caixa", "Você acaba levando só uma camiseta.", "Vou pagar em dinheiro.", "I will pay cash."],
    ["hear", "Porta do museu", "Você chega ao museu e lê o aviso na porta.", "Fechado para almoço.", "Out for lunch."],
    ["say", "Locadora", "Você decide conhecer os arredores.", "Gostaria de alugar um carro.", "I would like to hire a car."],
    ["hear", "Locadora", "O atendente pede dois documentos.", "Carteira de habilitação e seguro.", "Driver's licence and insurance."]
  ] },
  { name: "Imprevistos", place: "Quando algo sai do roteiro", scenes: [
    ["say", "Na rua", "Alguém puxa a sua mochila e sai correndo.", "Pega ladrão!", "Stop thief!"],
    ["hear", "Delegacia", "O policial pega um formulário e pergunta.", "Qual é o problema?", "What seems to be the trouble?"],
    ["say", "Delegacia", "Ele fala depressa e você perde metade.", "Como? Poderia repetir?", "I beg your pardon?"],
    ["say", "Farmácia", "Depois do susto, você procura um remédio.", "Estou com dor de cabeça.", "I have a headache."],
    ["hear", "Farmácia", "A farmacêutica entrega o remédio e diz.", "Estimo as melhoras.", "Get well soon."],
    ["hear", "Aeroporto", "No embarque de volta, o agente devolve o seu passaporte.", "Boa viagem!", "Have a nice trip!"]
  ] }
];
const stamped = k => (save.trip[k] || 0) >= PASS;
const stampCount = () => STOPS.reduce((n, _, k) => n + (stamped(k) ? 1 : 0), 0);
let leg = null;

function trip() {
  show("green",
    h("div", { class: "bar" },
      h("button", { class: "iconbtn", id: "trip-back", "aria-label": "Trocar de jogo", onclick: home }, icon("back")),
      h("span"),
      h("span", { class: "chipstat nums" }, stampCount() + " de " + STOPS.length + " carimbos")),
    h("div", { class: "row", style: "align-items:flex-end" },
      h("div", { class: "stack", style: "gap:6px" },
        h("h1", { class: "display huge" }, "Viagem"),
        h("p", { class: "small strong" }, PASS + " acertos em " + STOPS[0].scenes.length + " carimbam a parada.")),
      art("passport", 124)),
    h("div", { class: "chapters" }, STOPS.map((s, k) => {
      const open = k === 0 || stamped(k - 1);
      const best = save.trip[k];
      const status = stamped(k) ? "Carimbado, " + best + " de " + s.scenes.length
        : !open ? "Bloqueada"
        : best != null ? best + " de " + s.scenes.length + ", tente de novo"
        : s.place;
      return h("button", { class: "chapter stop" + (open ? "" : " locked"), id: "stop-" + k, style: open ? paint(STOP_FIELDS[k]) : null, disabled: !open, onclick: () => startStop(k) },
        art(STOP_ART[k], 64),
        h("span", { style: "min-width:0" }, h("span", { class: "name" }, s.name), h("span", { class: "fact nums" }, status)),
        icon(stamped(k) ? "check" : open ? "next" : "lock"));
    }))
  );
}

function startStop(k) {
  leg = { k, i: 0, results: [] };
  scene();
}

function scene() {
  const stop = STOPS[leg.k], sc = stop.scenes[leg.i], n = stop.scenes.length;
  const hear = sc[0] === "hear";
  const f = hear ? 3 : 4;
  const ans = sc[f];
  const opts = shuffle(shuffle(stop.scenes.filter(s => s !== sc).map(s => s[f])).slice(0, 3).concat(ans));
  const steps = h("div", { class: "steps", role: "img", "aria-label": "Situação " + (leg.i + 1) + " de " + n },
    stop.scenes.map((_, k) => h("i", { class: k < leg.i ? (leg.results[k] ? "ok" : "no") : (k === leg.i ? "now" : "") })));
  const buttons = opts.map((t, k) => h("button", { class: "btn", id: "opt-" + k, onclick: () => answer(t) }, t));
  const after = h("div", { class: "stack", "aria-live": "polite" });
  const pic = art(STOP_ART[leg.k], 88);
  const stage = h("div", { class: "stage" },
    h("div", { class: "row", style: "align-items:flex-end" },
      h("p", { style: "min-width:0" }, h("span", { class: "strong" }, sc[1] + ". "), sc[2]),
      pic),
    h("p", { class: big(hear ? sc[4] : sc[3]) }, hear ? sc[4] : sc[3]));

  function answer(t) {
    const right = t === ans;
    buttons.forEach(b => {
      b.disabled = true;
      if (b.textContent === ans) b.classList.add("right");
      else if (b.textContent === t) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    leg.results.push(right);
    if (right) { confetti(stage); pulse(pic); } else pic.classList.add("shake");
    const last = leg.i === n - 1;
    after.replaceChildren(...verdict(right,
      right ? "Isso!" : "Quase. O certo é:",
      ans, null, sc[4],
      last ? "Passaporte" : "Seguir viagem",
      () => { leg.i++; last ? stopResult() : scene(); }));
    document.getElementById("next").focus();
  }

  show(STOP_FIELDS[leg.k],
    h("div", { class: "bar" },
      h("button", { class: "iconbtn", id: "quit", "aria-label": "Sair da parada", onclick: trip }, icon("close")),
      steps,
      h("span", { class: "strong hud" }, stop.name)),
    stage,
    h("p", { class: "small strong" }, hear ? "O que isso quer dizer?" : "Como você diz isso em inglês?"),
    h("div", { class: "opts" }, buttons),
    after
  );
}

function stopResult() {
  const k = leg.k, stop = STOPS[k], n = stop.scenes.length;
  const hits = leg.results.filter(Boolean).length;
  const had = stamped(k);
  if (hits > (save.trip[k] == null ? -1 : save.trip[k])) { save.trip[k] = hits; persist(); }
  markPlayed();
  const ok = hits >= PASS;
  const nextStop = k + 1 < STOPS.length ? k + 1 : null;
  const scoreEl = h("p", { class: "display huge nums score" }, "0/" + n);
  const top = h("div", { class: "row burst" },
    scoreEl,
    ok ? h("div", { class: "stamp" + (had ? "" : " thunk") }, stop.name) : art(STOP_ART[k], 104));
  show(STOP_FIELDS[k],
    top,
    h("div", { class: "stack", style: "gap:4px" },
      h("h2", { class: "display head" }, ok ? (had ? "Carimbo confirmado." : "Carimbo no passaporte.") : "Sem carimbo desta vez."),
      h("p", { class: "strong" }, ok
        ? (nextStop == null ? "Viagem completa: " + stampCount() + " de " + STOPS.length + " carimbos." : "Próxima parada liberada.")
        : "Faltou pouco: são " + PASS + " acertos em " + n + ".")),
    h("div", { class: "opts" },
      ok && nextStop != null
        ? h("button", { class: "btn big", id: "next-stop", onclick: () => startStop(nextStop) }, STOPS[nextStop].name, icon("next"))
        : null,
      h("button", { class: "btn " + (ok ? "quiet" : "big"), id: "retry", onclick: () => startStop(k) }, "Refazer", icon("again")),
      h("button", { class: "btn quiet", id: "to-trip", onclick: trip }, "Passaporte", icon("back"))),
    marks(stop.scenes, leg.results, s => [h("b", null, s[4]), s[3]])
  );
  countUp(scoreEl, hits, v => v + "/" + n);
  if (ok) setTimeout(() => confetti(top), 600);
}

home();
</script>
</body>
